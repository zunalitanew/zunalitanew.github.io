<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zunalita — independent writing</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <script type="module" src="assets/js/pages/home.js"></script>
  </head>
  <body>
    <header>
      <h1><a href="./">Zunalita</a></h1>
      <p>Independent writing, freely shared.</p>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#stories">Stories</a></li>
          <li><a href="saved/">Reading list</a></li>
          <li><a href="create/">Write</a></li>
          <li><a href="about/">About</a></li>
          <li><a href="https://github.com/zunalita/posts">GitHub archive</a></li>
        </ul>
      </nav>
      <hr>
    </header>

    <main id="main">
      <h2 id="stories">Latest stories</h2>
      <label for="search">Find a story:</label>
      <input id="search" type="search" autocomplete="off">
      <p id="status" role="status" aria-live="polite">Loading story titles…</p>
      <ul id="story-list"></ul>
      <p id="empty" hidden><span id="empty-message"></span> <button id="clear-search" type="button">Clear search</button></p>
      <noscript><p>Enable JavaScript to load the story archive.</p></noscript>
    </main>

    <footer>
      <hr>
      <p><a href="create/">Write for Zunalita</a> · <a href="about/">About and privacy</a></p>
    </footer>
  </body>
</html>
